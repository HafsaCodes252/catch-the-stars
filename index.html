<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catch the Stars</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center;
  font-family:Arial,sans-serif; background:linear-gradient(135deg,#111827,#312e81);
  color:white; overflow:hidden;
}
.game{
  width:min(92vw,500px); padding:20px; border-radius:24px;
  background:rgba(255,255,255,.1); backdrop-filter:blur(12px);
  box-shadow:0 20px 60px rgba(0,0,0,.35); text-align:center;
}
h1{margin:0 0 8px;font-size:32px}
.info{display:flex;justify-content:space-between;margin:10px 4px 14px;font-weight:bold}
#board{
  position:relative; height:480px; overflow:hidden; border-radius:18px;
  background:radial-gradient(circle at 30% 20%,#4338ca,#0f172a 65%);
  border:2px solid rgba(255,255,255,.2); touch-action:none;
}
.star{
  position:absolute; width:48px;height:48px; display:grid;place-items:center;
  font-size:34px; cursor:pointer; user-select:none;
  animation:pop .12s ease-out;
}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
button{
  margin-top:14px; border:0; padding:12px 22px; border-radius:12px;
  background:#fbbf24; color:#111827; font-weight:bold; cursor:pointer;
}
small{display:block;margin-top:10px;opacity:.8}
</style>
</head>
<body>
<div class="game">
  <h1>⭐ Catch the Stars</h1>
  <div class="info"><span>Score: <b id="score">0</b></span><span>Time: <b id="time">30</b>s</span></div>
  <div id="board"></div>
  <button id="start">Start Game</button>
  <small>Tap/click the ⭐ as fast as you can!</small>
</div>

<script>
const board=document.getElementById("board");
const scoreEl=document.getElementById("score");
const timeEl=document.getElementById("time");
const startBtn=document.getElementById("start");
let score=0,time=30,timer=null,playing=false,starTimer=null;

function placeStar(){
  if(!playing)return;
  board.querySelectorAll(".star").forEach(s=>s.remove());
  const star=document.createElement("div");
  star.className="star";
  star.textContent="⭐";
  const maxX=board.clientWidth-48, maxY=board.clientHeight-48;
  star.style.left=Math.random()*maxX+"px";
  star.style.top=Math.random()*maxY+"px";
  star.onclick=()=>{
    if(!playing)return;
    score++;
    scoreEl.textContent=score;
    placeStar();
  };
  board.appendChild(star);
}
function endGame(){
  playing=false;
  clearInterval(timer); clearInterval(starTimer);
  board.querySelectorAll(".star").forEach(s=>s.remove());
  startBtn.textContent="Play Again";
  setTimeout(()=>alert("🎉 Game Over! Your score: "+score),50);
}
function startGame(){
  clearInterval(timer); clearInterval(starTimer);
  score=0; time=30; playing=true;
  scoreEl.textContent=score; timeEl.textContent=time;
  startBtn.textContent="Restart";
  placeStar();
  timer=setInterval(()=>{
    time--; timeEl.textContent=time;
    if(time<=0) endGame();
  },1000);
  starTimer=setInterval(placeStar,1200);
}
startBtn.onclick=startGame;
</script>
</body>
</html>
