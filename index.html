<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catch the Stars ✨</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}
body{
  overflow-x:hidden;color:#fff;
  background:#07051c;
  display:flex;justify-content:center;align-items:center;padding:18px;
}
body:before,body:after{
  content:"";position:fixed;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none
}
body:before{width:300px;height:300px;background:#7c3cff;left:-100px;top:-100px}
body:after{width:350px;height:350px;background:#00cfff;right:-130px;bottom:-130px}

.wrap{width:min(900px,100%);position:relative;z-index:1}
.header{text-align:center;margin-bottom:14px}
.badge{
 display:inline-block;padding:7px 14px;border-radius:999px;
 background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
 font-size:13px;letter-spacing:1px
}
h1{
 margin:9px 0 3px;font-size:clamp(36px,8vw,64px);
 letter-spacing:-2px;
 text-shadow:0 0 18px rgba(255,255,255,.35)
}
.sub{margin:0;color:#c9c7e8}

.stats{
 display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0
}
.stat{
 padding:12px 8px;border-radius:18px;
 background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.05));
 border:1px solid rgba(255,255,255,.15);
 box-shadow:0 10px 30px rgba(0,0,0,.2);
 backdrop-filter:blur(8px)
}
.stat small{display:block;color:#aaa8ca;font-size:12px;text-transform:uppercase}
.stat b{font-size:25px;display:block;margin-top:3px}

#gameArea{
 position:relative;width:100%;height:min(60vh,480px);min-height:350px;
 overflow:hidden;border-radius:30px;
 border:1px solid rgba(255,255,255,.22);
 background:
   radial-gradient(circle at 15% 25%,rgba(255,255,255,.18) 0 1px,transparent 2px),
   radial-gradient(circle at 70% 70%,rgba(255,255,255,.16) 0 1px,transparent 2px),
   radial-gradient(circle at 45% 10%,rgba(255,255,255,.13) 0 1px,transparent 2px),
   linear-gradient(160deg,#09082b,#11104a 45%,#061b42);
 background-size:auto,auto,auto,100% 100%;
 box-shadow:inset 0 0 70px rgba(0,0,0,.35),0 25px 80px rgba(0,0,0,.4);
}
#gameArea:before{
 content:"";position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.04),transparent 65%);
 animation:shine 5s infinite;
}
@keyframes shine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

.star{
 position:absolute;transform:translate(-50%,-50%);
 font-size:64px;cursor:pointer;user-select:none;
 filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 22px #ffd43b);
 animation:float .75s ease-in-out infinite alternate,appear .2s ease-out;
 z-index:3;
}
.diamond{
 font-size:56px;
 filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 24px #31eaff);
}
@keyframes float{
 from{transform:translate(-50%,-50%) scale(.94) rotate(-5deg)}
 to{transform:translate(-50%,-50%) scale(1.1) rotate(5deg)}
}
@keyframes appear{
 from{opacity:0;transform:translate(-50%,-50%) scale(.3)}
 to{opacity:1}
}

.controls{text-align:center;margin-top:14px}
button{
 border:0;padding:13px 20px;border-radius:16px;margin:4px;
 font-weight:800;font-size:15px;cursor:pointer;
 transition:.18s;box-shadow:0 8px 20px rgba(0,0,0,.2)
}
button:hover{transform:translateY(-2px) scale(1.02)}
#start{background:linear-gradient(135deg,#ffd84d,#ff9f43);color:#241500}
#music{background:linear-gradient(135deg,#b8ffcf,#59e6c1);color:#05251c}
#msg{min-height:28px;font-size:19px;font-weight:800;margin:12px 0 5px}
.help{text-align:center;color:#aaa8ca;font-size:13px}
.hint{
 display:inline-block;margin-top:8px;padding:7px 11px;border-radius:10px;
 background:rgba(255,255,255,.07)
}
</style>
</head>
<body>
<div class="wrap">
 <div class="header">
   <div class="badge">🌌 SPACE ARCADE • MUSIC EDITION</div>
   <h1>✨ Catch the Stars</h1>
   <p class="sub">Catch stars, collect diamonds & level up!</p>
 </div>

 <div class="stats">
   <div class="stat"><small>⭐ Score</small><b id="score">0</b></div>
   <div class="stat"><small>🚀 Level</small><b id="level">1</b></div>
   <div class="stat"><small>❤️ Lives</small><b id="lives">5</b></div>
   <div class="stat"><small>⏱️ Time</small><b id="time">60</b></div>
 </div>

 <div id="gameArea"></div>

 <div class="controls">
   <button id="start">🚀 START GAME</button>
   <button id="music">🔊 MUSIC ON</button>
   <div id="msg">Ready for an adventure? 🌟</div>
   <div class="help">
     <span class="hint">⌨️ Press SPACE to catch</span>
     <span class="hint">💎 Diamond = +5</span>
   </div>
 </div>
</div>

<script>
let score=0,level=1,lives=5,time=60,running=false,star=null;
let timer=null,musicTimer=null,musicOn=true,audioCtx=null;

const area=document.getElementById('gameArea');
const scoreEl=document.getElementById('score'),levelEl=document.getElementById('level');
const livesEl=document.getElementById('lives'),timeEl=document.getElementById('time');
const msg=document.getElementById('msg'),start=document.getElementById('start'),music=document.getElementById('music');

function update(){
 scoreEl.textContent=score;levelEl.textContent=level;
 livesEl.textContent=lives;timeEl.textContent=time;
}
function audio(){
 if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
 if(audioCtx.state==='suspended')audioCtx.resume();
}
function tone(f,d=.12,type='sine',v=.035,delay=0){
 if(!musicOn)return; audio();
 let o=audioCtx.createOscillator(),g=audioCtx.createGain();
 o.type=type;o.frequency.value=f;
 g.gain.setValueAtTime(.001,audioCtx.currentTime+delay);
 g.gain.exponentialRampToValueAtTime(v,audioCtx.currentTime+delay+.025);
 g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+delay+d);
 o.connect(g);g.connect(audioCtx.destination);
 o.start(audioCtx.currentTime+delay);o.stop(audioCtx.currentTime+delay+d+.03);
}
function playMusic(){
 if(!musicOn)return;audio();clearInterval(musicTimer);
 const notes=[262,330,392,523,392,330,294,349];let i=0;
 musicTimer=setInterval(()=>{if(running){tone(notes[i%8],.3,'triangle',.02);i++}},430);
}
function stopMusic(){clearInterval(musicTimer)}
function catchSound(){tone(660,.1,'square',.07);tone(880,.16,'sine',.05,.07)}
function gemSound(){tone(523,.12,'triangle',.06);tone(659,.12,'triangle',.06,.1);tone(1047,.22,'triangle',.07,.2)}

function remove(){if(star){star.remove();star=null}}
function spawn(){
 remove();if(!running)return;
 star=document.createElement('div');
 let gem=Math.random()<.15;
 star.className='star'+(gem?' diamond':'');
 star.textContent=gem?'💎':'⭐';
 star.dataset.gem=gem?'1':'0';
 star.style.left=(8+Math.random()*84)+'%';
 star.style.top=(10+Math.random()*78)+'%';
 area.appendChild(star);
}
function catchStar(){
 if(!running||!star)return;
 let gem=star.dataset.gem==='1';
 score+=gem?5:1;level=Math.floor(score/10)+1;
 gem?gemSound():catchSound();
 msg.textContent=gem?'💎 AMAZING! +5':'⭐ Nice catch! +1';
 spawn();update();
}
function end(text){
 running=false;clearInterval(timer);stopMusic();remove();
 msg.textContent=text+' 🎮 Final score: '+score;
 start.textContent='🔄 PLAY AGAIN';
}
function startGame(){
 audio();score=0;level=1;lives=5;time=60;running=true;
 update();msg.textContent='GO! Catch the stars! 🚀';
 start.textContent='🔄 RESTART';spawn();playMusic();
 clearInterval(timer);
 timer=setInterval(()=>{time--;update();if(time<=0)end('⏰ Time up!')},1000);
}
start.onclick=startGame;
music.onclick=()=>{
 musicOn=!musicOn;music.textContent=musicOn?'🔊 MUSIC ON':'🔇 MUSIC OFF';
 if(musicOn&&running)playMusic();else if(!musicOn)stopMusic();
};
document.addEventListener('keydown',e=>{
 if(e.code==='Space'){e.preventDefault();catchStar()}
});
area.addEventListener('click',e=>{if(e.target.classList.contains('star'))catchStar()});
update();
</script>
</body>
</html>
