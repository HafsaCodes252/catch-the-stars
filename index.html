<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catch the Stars ⭐</title>
<style>
body{margin:0;background:#17133b;color:#fff;font-family:Arial;text-align:center}
h1{margin:18px 0 8px}
#score,#time{font-size:20px;margin:6px}
#game{position:relative;margin:15px auto;width:min(90vw,700px);height:60vh;min-height:350px;max-height:550px;border:3px solid white;border-radius:18px;overflow:hidden;background:radial-gradient(circle,#37306f,#100d27)}
#star{position:absolute;font-size:52px;display:none}
#message{margin:10px;font-size:18px}
button{padding:13px 25px;border:0;border-radius:10px;font-size:18px;font-weight:bold}
</style>
</head>
<body>
<h1>⭐ Catch the Stars</h1>
<div id="score">Score: 0</div>
<div id="time">Time: 30</div>
<div id="game"><div id="star">⭐</div></div>
<div id="message">Press <b>START</b>, then press <b>SPACE</b> whenever you see the ⭐!</div>
<button id="start">START GAME</button>

<script>
const game=document.getElementById("game");
const star=document.getElementById("star");
const scoreBox=document.getElementById("score");
const timeBox=document.getElementById("time");
const message=document.getElementById("message");
const start=document.getElementById("start");

let score=0,time=30,running=false,timer;

function moveStar(){
  const x=Math.random()*(game.clientWidth-70)+10;
  const y=Math.random()*(game.clientHeight-80)+10;
  star.style.left=x+"px";
  star.style.top=y+"px";
}

function startGame(){
  score=0;time=30;running=true;
  scoreBox.textContent="Score: 0";
  timeBox.textContent="Time: 30";
  message.innerHTML="Press <b>SPACE</b> when you see the ⭐!";
  start.textContent="RESTART";
  star.style.display="block";
  moveStar();
  clearInterval(timer);
  timer=setInterval(()=>{
    time--;
    timeBox.textContent="Time: "+time;
    if(time<=0){
      clearInterval(timer);
      running=false;
      star.style.display="none";
      message.innerHTML="Game Over! ⭐ Your score: <b>"+score+"</b>";
      start.textContent="PLAY AGAIN";
    }
  },1000);
}

document.addEventListener("keydown",e=>{
  if(e.code==="Space"){
    e.preventDefault();
    if(!running)return;
    score++;
    scoreBox.textContent="Score: "+score;
    moveStar();
  }
});

start.onclick=startGame;
</script>
</body>
</html>
